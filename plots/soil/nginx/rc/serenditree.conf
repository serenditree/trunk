load_module modules/ngx_otel_module.so;

events {
    worker_connections 1024;
}

http {

    otel_exporter {
        endpoint $OTEL_HOST:$OTEL_PORT;
    }

    otel_trace              $OTEL_ENABLED;
    otel_service_name       $OTEL_SERVICE;
    otel_span_name          $OTEL_SPAN;
    otel_trace_context      propagate;

    log_format              main '[$time_local] '
                                 '"$request" $status $body_bytes_sent "$http_referer" '
                                 '"$http_user_agent" "$http_x_forwarded_for"';

    include                 mime.types;
    default_type            application/octet-stream;
    gzip                    on;
    gzip_proxied            any;
    gzip_types              "*";
    server_tokens           off;
    sendfile                on;
    tcp_nopush              on;

    server {
        listen      8080;
        listen      [::]:8080;
        server_name leaf;
        root        $SERENDITREE_CONTENT;
        index       index.html;

        location / {
            add_header X-Serenditree-Stage "$SERENDITREE_STAGE";

            try_files $uri $uri/ /index.html;
        }

        location ~ /\. {
            deny all;
        }
    }
}
