load_module modules/ngx_otel_module.so;

events {
    worker_connections 1024;
}

http {

    otel_exporter {
        endpoint $OTEL_HOST:$OTEL_PORT;
    }

    otel_trace              $OTEL_ENABLED;
    otel_service_name       $OTEL_SERVICE;
    otel_span_name          $OTEL_SPAN;
    otel_trace_context      propagate;

    log_format              main '[$time_local] '
                                 '"$request" $status $body_bytes_sent "$http_referer" '
                                 '"$http_user_agent" "$http_x_forwarded_for"';

    proxy_cache_path $SERENDITREE_ROOT/cache
                     keys_zone=$OTEL_SERVICE:100m
                     levels=1:2
                     inactive=2w
                     max_size=10g;

    include                 mime.types;
    default_type            application/octet-stream;
    gzip                    on;
    gzip_proxied            any;
    gzip_types              "*";

    split_clients $otel_trace_id $ratio_sampler {
        30% on;
        *   off;
    }

    server {
        listen      8080;
        listen      [::]:8080;
        server_name root-map;

        location / {
            otel_trace          $ratio_sampler;
            otel_trace_context  inject;

            proxy_pass          http://127.0.0.1:8081/;
            proxy_cache         $OTEL_SERVICE;
            proxy_cache_valid   200 1w;

            add_header X-Serenditree-Stage "$SERENDITREE_STAGE";
            add_header X-Cache-Status $upstream_cache_status;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ~ /\. {
            deny all;
        }
    }
}
