---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fence-root-seed
spec:
  endpointSelector:
    matchLabels:
      serenditree.io/policy: fence-root-seed
  ingress:
    - fromEntities:
        - cluster
  egress:
    - toEndpoints:
        - matchLabels:
            serenditree.io/policy: fence-root-seed
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: serenditree-backup-seed.sos-{{ .Values.global.zone.storage1 }}.exo.io
        - matchName: artifacts.opensearch.org
