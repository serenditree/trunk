cilium:
  cluster:
    name: ~
  routingMode: tunnel
  tunnelProtocol: vxlan
  kubeProxyReplacement: true
  k8sServiceHost: ~
  k8sServicePort: 443
  ipv6:
    enabled: false
  ipam:
    operator:
      clusterPoolIPv4PodCIDRList:
        - "192.168.0.0/16"
  resources:
     requests:
       cpu: 100m
       memory: 250Mi
     limits:
       cpu: 500m
       memory: 500Mi
  encryption:
    enabled: true
    type: wireguard
    nodeEncryption: true
    strictMode:
      egress:
        enabled: true
        cidr: "192.168.0.0/16"
        allowRemoteNodeIdentities: true
      ingress:
        enabled: true
  envoy:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 100m
        memory: 200Mi
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true
    metrics:
      enableOpenMetrics: true
      enabled:
        - httpV2:exemplars=true;labelsContext=source_namespace,source_app,source_ip,destination_namespace,destination_app,destination_ip,traffic_direction
        - dns
        - drop
        - tcp
        - flow
        - port-distribution
        - icmp
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
  dashboards:
    enabled: true
  operator:
    resources:
      requests:
        cpu: 50m
        memory: 150Mi
      limits:
        cpu: 200m
        memory: 250Mi
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      trustCRDsExist: true
      enabled: true
