global:
  host: ~
  wait: ~
  wave: ~
cert-manager:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  crds:
    enabled: true
  startupapicheck:
    enabled: false
  webhook:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  cainjector:
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  extraArgs:
    - --enable-gateway-api
exoscale-webhook:
  certManager:
    namespace: terra-certs
    serviceAccountName: terra-certs-cert-manager
letsencrypt:
  issuer: ~
  email: ~
