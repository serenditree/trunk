global:
  wait: ~
  wave: ~
opentelemetry-collector:
  fullnameOverride: collect
  mode: daemonset
  image:
    repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s"
  resources:
    requests:
      cpu: 200m
      memory: 400Mi
    limits:
      cpu: 200m
      memory: 400Mi
  command:
    name: "otelcol-k8s"
  service:
    enabled: true
  presets:
    logsCollection:
      enabled: true
    kubernetesAttributes:
      enabled: true
      extractAllPodLabels: true
  config:
    exporters:
      debug:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 10
      otlphttp/logs:
        logs_endpoint: http://vlsingle-terra-scope.terra-scope.svc.cluster.local:9428/insert/opentelemetry/v1/logs
      otlphttp/traces:
        traces_endpoint: http://vtsingle-terra-scope.terra-scope.svc.cluster.local:10428/insert/opentelemetry/v1/traces
    processors:
      filter/logs:
        error_mode: ignore
        logs:
          log_record:
            - resource.attributes["serenditree.io/otel"] == nil
      filter/traces:
        error_mode: ignore
        traces:
          span:
            - IsMatch(attributes["http.user_agent"], "^kube-probe.*")
      batch:
        send_batch_max_size: 1500
        send_batch_size: 1000
        timeout: 1s
      k8sattributes:
        extract:
          labels:
            - from: pod
              key: app.kubernetes.io/name
              tag_name: service.name
            - from: pod
              key: k8s-app
              tag_name: service.name
            - from: pod
              key: app.kubernetes.io/instance
              tag_name: k8s.app.instance
            - from: pod
              key: app.kubernetes.io/version
              tag_name: service.version
            - from: pod
              key: app.kubernetes.io/component
              tag_name: k8s.app.component
            - from: pod
              key_regex: (.*)
              tag_name: $$1
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.replicaset.uid
            - k8s.daemonset.name
            - k8s.daemonset.uid
            - k8s.job.name
            - k8s.job.uid
            - k8s.container.name
            - k8s.cronjob.name
            - k8s.statefulset.name
            - k8s.statefulset.uid
            - container.image.tag
            - container.image.name
            - k8s.cluster.uid
        filter:
          node_from_env_var: K8S_NODE_NAME
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
              - from: resource_attribute
                name: k8s.node.name
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
          - sources:
              - from: connection
      resourcedetection/env:
        detectors:
          - env
        override: false
        timeout: 2s
    receivers:
      filelog:
        exclude: [ ]
        include:
          - /var/log/pods/*/*/*.log
        include_file_name: false
        include_file_path: true
        operators:
          - id: container-parser
            max_log_size: 102400
            type: container
        retry_on_failure:
          enabled: true
        start_at: end
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
    service:
      pipelines:
        logs:
          exporters:
            - otlphttp/logs
          processors:
            - k8sattributes
            - resourcedetection/env
            - batch
            - filter/logs
          receivers:
            - otlp
            - filelog
        metrics:
          exporters:
            - debug
          processors:
            - k8sattributes
            - resourcedetection/env
            - batch
          receivers:
            - otlp
        traces:
          exporters:
            - otlphttp/traces
          processors:
            - k8sattributes
            - resourcedetection/env
            - batch
            - filter/traces
          receivers:
            - otlp
