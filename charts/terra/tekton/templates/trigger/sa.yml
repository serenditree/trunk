---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: el-serenditree
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: el-serenditree
rules:
  - apiGroups:
      - triggers.tekton.dev
    resources:
      - eventlisteners
      - triggerbindings
      - triggertemplates
      - triggers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
      - taskruns
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    resourceNames:
      - el-serenditree
    verbs:
      - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: el-serenditree
subjects:
  - kind: ServiceAccount
    name: el-serenditree
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: el-serenditree
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: el-serenditree
rules:
  - apiGroups:
      - triggers.tekton.dev
    resources:
      - clusterinterceptors
      - clustertriggerbindings
      - interceptors
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: el-serenditree
subjects:
  - kind: ServiceAccount
    name: el-serenditree
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: el-serenditree
