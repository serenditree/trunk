---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: el-serenditree
  labels:
    app.kubernetes.io/component: tekton
spec:
  parentRefs:
    - name: serenditree
      namespace: terra-gateway
  hostnames:
    - {{ .Values.global.host }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: el-serenditree
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /webhooks/tekton
