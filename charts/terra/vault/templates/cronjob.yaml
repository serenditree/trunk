apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-rotation
  namespace: terra-vault
spec:
  schedule: "0 0 * * 0" # Weekly on Sunday at midnight.
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: rotate
              image: quay.io/serenditree/buildah:latest # Has all tools on board.
              command:
                - /bin/bash
                - /scripts/rotate.sh
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: vault-token
                  mountPath: /var/run/secrets/vault
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: vault-rotation
                defaultMode: 0755
            - name: vault-token
              secret:
                secretName: vault-internal
          restartPolicy: OnFailure
