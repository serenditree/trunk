---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-www-redirects
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.terraGateway.name }}
      sectionName: http
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.terraGateway.name }}
      sectionName: http-www
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.terraGateway.name }}
      sectionName: https-www
  hostnames:
    - {{ .Values.global.host }}
    - www.{{ .Values.global.host }}
  rules:
    - filters:
        - requestRedirect:
            scheme: https
            hostname: {{ .Values.global.host }}
            statusCode: 301
          type: RequestRedirect
      matches:
        - path:
            type: PathPrefix
            value: /
