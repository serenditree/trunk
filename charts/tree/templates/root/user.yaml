apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.rootUser.name }}
  namespace: {{ .Values.global.argocdNamespace }}
  annotations:
    serenditree.io/wave: {{ .Values.rootUser.wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.global.repository | quote }}
    path: "{{ .Values.global.rootPath }}/{{ trimPrefix .Values.global.rootPrefix .Values.rootUser.name }}"
    targetRevision: {{ .Values.rootUser.revision | default .Values.global.revision | quote }}
    helm:
      parameters:
        - name: global.wait
          value: {{ .Values.global.wait | quote }}
        - name: global.wave
          value: {{ .Values.rootUser.wave | quote }}
        - name: global.context
          value: {{ .Values.global.context }}
        - name: global.zone.storage1
          value: {{ .Values.global.zone.storage1 | quote }}
  destination:
    server: {{ .Values.global.destinationServer }}
    namespace: {{ .Values.rootUser.namespace }}
  syncPolicy:
    automated: {{ .Values.global.automated | toYaml | nindent 6 }}
    retry: {{ .Values.global.retry | toYaml | nindent 6  }}
    syncOptions:
      - CreateNamespace=true
